# Builds PackForge for Windows (installer + portable zip) and Linux (AppImage + .deb). On demand it
# only keeps them as run artifacts; for a `v*` tag it also publishes a GitHub release with them, its
# notes taken from the tag's section of CHANGELOG.md. A normal release, not a pre-release: the app's
# update check reads releases/latest, which skips pre-releases.
#
# Windows signing (SignPath Foundation, free for open source) runs only once the repository has the
# variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN; without them the files are
# published unsigned. The app is signed first, then the installer is made from the signed app and
# signed too. Artifact configurations: .github/signpath/*.xml. Built here because Windows 11 Smart
# App Control on the dev PC blocks the unsigned helper electron-builder runs for the installer.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The unpacked app (release/win-unpacked): signed before it goes into the installer.
      - run: npx electron-builder --win --x64 --dir --publish never
      - name: Upload the unsigned app
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-app
          path: release/win-unpacked
          if-no-files-found: error
      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: packforge
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/win-signed
      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: bash
        run: cp release/win-signed/PackForge.exe release/win-unpacked/PackForge.exe
      # Installer and portable zip from the (signed) app.
      - run: npx electron-builder --win --x64 --prepackaged release/win-unpacked --publish never
      - name: Upload the unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer
          path: release/PackForge-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: packforge
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/installer-signed
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: bash
        run: cp release/installer-signed/PackForge-Setup-*.exe release/
      - uses: actions/upload-artifact@v5
        with:
          name: PackForge-windows
          path: |
            release/PackForge-Setup-*.exe
            release/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v5
        with:
          name: PackForge-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: PackForge-*
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" > notes.md
          tail -n +3 notes.md > body.md
          ls -l dist
          gh release create "$TAG" dist/* \
            --title "PackForge $(head -1 notes.md)" --notes-file body.md
