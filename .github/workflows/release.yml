# Builds the Windows installer and the portable zip (electron-builder), on demand or for a
# `v*` tag, and keeps them as run artifacts. Nothing is published: making a GitHub release from
# them stays a manual step. Built here because Windows 11 Smart App Control on a dev PC blocks
# the unsigned helper electron-builder runs while making the installer.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
      - uses: actions/upload-artifact@v5
        with:
          name: PackForge-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
